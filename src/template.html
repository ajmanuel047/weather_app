<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
  </head>
  <body>
    <div id="container">
      <div id="searchBox">
        <h3>Input Your Address Below</h3>
        <search>
          <form novalidate>
            <input
              type="text"
              name="userInput"
              id="userInput"
              minlength="4"
              placeholder="Either Country Or State"
              required
            />
            <span class="errorMessage" aria-live="polite"></span>
            <button id="submit">Search</button>
          </form>
        </search>
      </div>

      <div id="weatherInfoDiv">
        <div id="infoDivHeader">
          <div id="iconAndLocation">
            <i class="fa-solid fa-location-dot"></i>
            <p id="location">Canada</p>
          </div>
          <button id="toggleButton">
            <span id="degreeIcon">o</span><span id="celsiusIcon">C</span> /
            <span id="degreeIcon">o</span><span id="fahrenheitIcon">F</span>
          </button>
        </div>
        <div id="temperatureDiv">
          <div id="tempDiv">
            <p id="temp">22</p>
            <span class="degreeIcon">o</span>
            <span class="unit celsius">C</span>
          </div>
          <p id="weatherNature">Partly Cloudy</p>
        </div>
        <div id="weatherReadings">
          <div id="humidity">
            <p>Humidity</p>
            <p id="humidityValue">55%</p>
          </div>
          <div id="wind">
            <p>Wind</p>
            <p id="windValue">15 km/h</p>
          </div>
          <div id="tempAssume">
            <p>Feels Like</p>
            <p id="temp2">24</p>
            <span class="degreeIcon">o</span>
            <p class="unit">C</p>
          </div>
        </div>
      </div>
      <div id="weatherInfoDiv2"></div>
    </div>
  </body>
</html>
