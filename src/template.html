<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="searchBox">
      <h3>Input Your Address Below</h3>
      <search>
        <form novalidate>
          <input
            type="text"
            name="userInput"
            id="userInput"
            minlength="4"
            placeholder="Either Country Or State"
            required
          />
          <span class="errorMessage" aria-live="polite"></span>
          <button id="submit">Search</button>
        </form>
      </search>
    </div>

    <div id="weatherInfoDiv">
      <div id="infoDivHeader">
        <div id="iconAndLocation">
          <div id="icon">icon</div>
          <p id="location">location</p>
        </div>
        <button id="toogleButton"><span>o</span>C / <span>o</span>F</button>
      </div>
      <div id="temperatureDiv">
        <p id="temp"></p>
        <p id="weatherNature"></p>
      </div>
      <div id="weatherNatures">
        <div id="humidity"></div>
        <div id="wind"></div>
        <div id="temp2"></div>
      </div>
    </div>
  </body>
</html>
